name: arcane_lexicon
description: Transform markdown directories into documentation websites with generated navigation, search, theming, and rich markdown components. Built on Jaspr.
version: 2.0.0
repository: https://github.com/ArcaneArts/arcane_lexicon
homepage: https://github.com/ArcaneArts/arcane_lexicon
documentation: https://github.com/ArcaneArts/arcane_lexicon#readme

topics:
  - documentation
  - markdown
  - static-site
  - jaspr
  - knowledge-base

executables:
  arcane_lexicon:

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.1
  jaspr_content: ^0.5.2
  jaspr_lucide: ^0.55.0
  arcane_jaspr: ^4.0.0

  yaml: ^3.1.3
  json5: ^0.8.2

dev_dependencies:
  arcane_jaspr_shadcn:
    path: ../arcane_jaspr/packages/arcane_jaspr_shadcn
  build_runner: ^2.15.0
  jaspr_builder: ^0.23.1
  lints: ^6.1.0
  test: ^1.26.3

dependency_overrides:
  arcane_jaspr:
    path: ../arcane_jaspr

scripts:
  serve_demo: dart tool/arcane_lexicon_demo.dart
  build_demo: dart tool/arcane_lexicon_demo.dart build
