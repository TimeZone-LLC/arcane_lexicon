name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'example/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tool/**'
      - 'pubspec.yaml'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  # Sent by the arcane_jaspr docs deploy so this site tracks arcane_jaspr master.
  repository_dispatch:
    types: [arcane-jaspr-updated]
  # Weekly rebuild against arcane_jaspr master in case a dispatch is missed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Checkout arcane_jaspr dependency
        run: git clone --depth 1 https://github.com/ArcaneArts/arcane_jaspr.git ../arcane_jaspr

      - name: Install package dependencies
        run: dart pub get

      - name: Analyze package
        run: dart analyze

      - name: Run design contracts
        run: dart test

      - name: Install dependencies
        working-directory: example
        run: dart pub get

      - name: Install jaspr CLI
        run: dart pub global activate jaspr_cli

      - name: Build static site
        working-directory: example
        run: dart pub global run jaspr_cli:jaspr build --dart-define=BASE_URL=/arcane_lexicon

      - name: Install browser policy runner
        working-directory: tool/browser_policy
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify static build contract
        working-directory: tool/browser_policy
        run: npm run test:build

      - name: Enforce browser design policy
        shell: bash
        run: |
          audit_root=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE/example/build/jaspr" "$audit_root/arcane_lexicon"
          python3 -m http.server 41738 --bind 127.0.0.1 \
            --directory "$audit_root" &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          ARCANE_LEXICON_DOCS_URL=http://127.0.0.1:41738/arcane_lexicon \
            npm --prefix tool/browser_policy run audit

      - name: Add .nojekyll
        working-directory: example
        run: touch build/jaspr/.nojekyll

      - name: Copy 404.html for SPA routing
        working-directory: example
        run: cp build/jaspr/index.html build/jaspr/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/jaspr

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
